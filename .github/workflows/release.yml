name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  set_version:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: version
        shell: bash
        run: |
          VERSION="$(git log -1 --format=%s | tr -d '[:space:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          NAME="$(jq -r .name package.json)"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

  create_draft_release:
    needs: [set_version]
    runs-on: ubuntu-slim
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.set_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.set_version.outputs.name }} ${{ needs.set_version.outputs.version }}
          body: |
            ${{ needs.set_version.outputs.version }} ${{ github.sha }}
          draft: true

  publish:
    needs: [set_version, create_draft_release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x64

    runs-on: ${{ matrix.platform }}

    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version
        shell: bash
        run: |
          VERSION="${{ needs.set_version.outputs.version }}"
          sed -i "s/\"version\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"version\": \"${VERSION}\"/" package.json

      - name: Set up EVS
        if: env.EVS_ACCOUNT_NAME != '' && env.EVS_PASSWD != ''
        shell: bash
        run: |
          python -m pip install --upgrade castlabs-evs
          python -m castlabs_evs.account -n reauth -A "$EVS_ACCOUNT_NAME" -P "$EVS_PASSWD"
          echo "EVS_SIGN=1" >> "$GITHUB_ENV"

      - name: Build app
        run: pnpm dist --publish never

      - name: Upload assets
        shell: bash
        run: gh release upload "${{ needs.set_version.outputs.version }}" dist/*-setup.exe --clobber

  finalize_release:
    needs: [set_version, create_draft_release, publish]
    runs-on: ubuntu-slim
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.set_version.outputs.version }}
          draft: false
