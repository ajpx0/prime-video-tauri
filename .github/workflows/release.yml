name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  set_version:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: version
        shell: bash
        run: |
          VERSION="$(git log -1 --format=%s | tr -d '[:space:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          NAME="$(jq -r .name package.json)"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

  create_draft_release:
    needs: [set_version]
    runs-on: ubuntu-slim
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.set_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.set_version.outputs.name }} ${{ needs.set_version.outputs.version }}
          body: |
            ${{ needs.set_version.outputs.version }} ${{ github.sha }}
          draft: true

  publish:
    needs: [set_version, create_draft_release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version
        shell: bash
        run: |
          VERSION="${{ needs.set_version.outputs.version }}"
          sed -i "s/\"version\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"version\": \"${VERSION}\"/" package.json
          sed -i "s/\"version\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"version\": \"${VERSION}\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \"[0-9]*\.[0-9]*\.[0-9]*\"/version = \"${VERSION}\"/" src-tauri/Cargo.toml
          cargo update --manifest-path src-tauri/Cargo.toml --workspace

      - uses: tauri-apps/tauri-action@v1
        with:
          releaseId: ${{ needs.create_draft_release.outputs.release_id }}
          releaseAssetNamePattern: '[mainBinaryName]_[arch][setup][ext]'
          args: --target ${{ matrix.target }}

  finalize_release:
    needs: [set_version, create_draft_release, publish]
    runs-on: ubuntu-slim
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.set_version.outputs.version }}
          draft: false
