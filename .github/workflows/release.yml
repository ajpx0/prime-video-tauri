name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  set_version:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ github.event.head_commit.message }}
      name: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: package
        uses: jaywcjlove/github-action-package@v2.1.0

  create_draft_release:
    needs: [set_version]
    runs-on: ubuntu-slim
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.set_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.set_version.outputs.name }} ${{ needs.set_version.outputs.version }}
          body: |
            ${{ needs.set_version.outputs.version }} ${{ github.sha }}
          draft: true

  publish:
    needs: [set_version, create_draft_release]
    permissions:
      contents: write
    runs-on: windows-latest

    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
      EVS_SIGN: 1

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: .github/workflows/*.yml

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-

      - run: pnpm install --frozen-lockfile

      - uses: jaywcjlove/github-action-package@v2.1.0
        with:
          version: ${{ needs.set_version.outputs.version }}

      - run: pip install castlabs-evs==1.3.2

      - run: evs-account -n reauth -A $env:EVS_ACCOUNT_NAME -P $env:EVS_PASSWD

      - run: pnpm dist --publish never

      - run: evs-vmp verify-pkg dist/win-unpacked

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.set_version.outputs.version }}
          draft: true
          files: dist/*-setup.exe
          fail_on_unmatched_files: true

  finalize_release:
    needs: [set_version, create_draft_release, publish]
    runs-on: ubuntu-slim
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.set_version.outputs.version }}
          draft: false
