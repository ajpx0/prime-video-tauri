name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  set_version:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: version
        shell: bash
        run: |
          VERSION="$(git log -1 --format=%s | tr -d '[:space:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          NAME="$(jq -r .name package.json)"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

  create_draft_release:
    needs: [set_version]
    runs-on: ubuntu-slim
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.set_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.set_version.outputs.name }} ${{ needs.set_version.outputs.version }}
          body: |
            ${{ needs.set_version.outputs.version }} ${{ github.sha }}
          draft: true

  publish:
    needs: [set_version, create_draft_release]
    permissions:
      contents: write
    runs-on: windows-latest

    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - shell: bash
        run: |
          VERSION="${{ needs.set_version.outputs.version }}"
          sed -i "s/\"version\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"version\": \"${VERSION}\"/" package.json

      - shell: bash
        run: |
          if [ -z "$EVS_ACCOUNT_NAME" ] || [ -z "$EVS_PASSWD" ]; then
            echo "::error::EVS_ACCOUNT_NAME / EVS_PASSWD secrets are required for VMP signing"
            exit 1
          fi
          python -m pip install castlabs-evs==1.3.2
          evs-account -n reauth -A "$EVS_ACCOUNT_NAME" -P "$EVS_PASSWD"
          echo "EVS_SIGN=1" >> "$GITHUB_ENV"

      - run: pnpm dist --publish never

      - run: evs-vmp verify-pkg dist/win-unpacked

      - shell: bash
        run: gh release upload "${{ needs.set_version.outputs.version }}" dist/*-setup.exe --clobber

  finalize_release:
    needs: [set_version, create_draft_release, publish]
    runs-on: ubuntu-slim
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.set_version.outputs.version }}
          draft: false
