name: Build

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: .github/workflows/*.yml

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-

      - run: pnpm install --frozen-lockfile

      - shell: bash
        run: |
          if [ -z "$EVS_ACCOUNT_NAME" ] || [ -z "$EVS_PASSWD" ]; then
            echo "::error::EVS_ACCOUNT_NAME / EVS_PASSWD secrets are required for VMP signing"
            exit 1
          fi
          python -m pip install castlabs-evs==1.3.2
          evs-account -n reauth -A "$EVS_ACCOUNT_NAME" -P "$EVS_PASSWD"
          echo "EVS_SIGN=1" >> "$GITHUB_ENV"

      - run: pnpm build

      - run: evs-vmp verify-pkg dist/win-unpacked
