stages:
  - build
  - release

variables:
  RELEASE_SOURCE_BRANCH:
    value: develop
    description: Create Release Commit のマージ元ブランチ
  RELEASE_VERSION:
    value: ""
    description: Create Release Commit のバージョン (x.y.z)

.electron:
  tags: [saas-windows-medium-amd64]
  variables:
    EVS_SIGN: "1"
    ELECTRON_CACHE: $CI_PROJECT_DIR\.cache\electron
    ELECTRON_BUILDER_CACHE: $CI_PROJECT_DIR\.cache\electron-builder
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .cache/
      - .pnpm-store/
  before_script:
    - $ProgressPreference = 'SilentlyContinue'
    - $v = (Invoke-RestMethod https://nodejs.org/dist/index.json | Where-Object { $_.lts } | Select-Object -First 1).version
    - Invoke-WebRequest "https://nodejs.org/dist/$v/node-$v-win-x64.zip" -OutFile node.zip
    - Expand-Archive node.zip -DestinationPath C:\node
    - $env:Path = "C:\node\node-$v-win-x64;$env:Path"
    - choco install python312 -y --no-progress
    - $env:Path = "C:\Python312;C:\Python312\Scripts;$env:Path"
    - npm i -g corepack
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pip install castlabs-evs==1.3.2
    - evs-account -n reauth -A $env:EVS_ACCOUNT_NAME -P $env:EVS_PASSWD

build:
  extends: .electron
  stage: build
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"
  script:
    - pnpm build
    - evs-vmp verify-pkg dist/win-unpacked

release:
  extends: .electron
  stage: release
  resource_group: release
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
  script:
    - $ver = $env:CI_COMMIT_TITLE.Trim()
    - $name = (Get-Content package.json -Raw | ConvertFrom-Json).name
    - npm pkg set "version=$ver"
    - pnpm dist --publish never
    - evs-vmp verify-pkg dist/win-unpacked
    - $files = @(Get-ChildItem dist\*-setup.exe)
    - if ($files.Count -eq 0) { throw "dist/*-setup.exe not found" }
    - |
      $links = foreach ($f in $files) {
        $u = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/release/$ver/$($f.Name)"
        Invoke-RestMethod -Method Put -Uri $u -Headers @{ 'JOB-TOKEN' = $env:CI_JOB_TOKEN } -InFile $f.FullName
        @{ name = $f.Name; url = $u; link_type = "package" }
      }
    - $body = @{ tag_name = $ver; ref = $env:CI_COMMIT_SHA; name = "$name $ver"; description = "$ver $env:CI_COMMIT_SHA"; assets = @{ links = @($links) } } | ConvertTo-Json -Depth 5
    - Invoke-RestMethod -Method Post -Uri "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/releases" -Headers @{ 'JOB-TOKEN' = $env:CI_JOB_TOKEN } -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($body))

create-release-commit:
  stage: build
  image: alpine:3.20
  resource_group: create-release-commit
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION
  before_script:
    - apk add --no-cache git
  script:
    - |
      set -eu
      echo "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Invalid version: $RELEASE_VERSION" >&2; exit 1; }
      git config user.name "$GITLAB_USER_NAME"
      git config user.email "$GITLAB_USER_EMAIL"
      git remote set-url origin "https://oauth2:${RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git fetch origin main "$RELEASE_SOURCE_BRANCH"
      git checkout -B main origin/main
      git merge --no-ff -m "$RELEASE_VERSION" "origin/$RELEASE_SOURCE_BRANCH"
      git push origin main
